[project]
name = "i-datagon"
dynamic = ["version"]
description = "Sandbox allocation lab for T-Invest"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "asyncpg>=0.30",
    "uvicorn[standard]>=0.32",
    "protobuf>=4.25.1,<5",
    "tinkoff @ file:vendor/tinkoff-ns",
    "tinkoff-investments @ git+https://github.com/RussianInvestments/invest-python.git@0.2.0-beta117",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.0", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.agent", "app.broker", "app.news", "app.ops", "worker"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.ruff]
target-version = "py312"
src = ["app", "worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
