services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://idatagon:idatagon@postgres:5432/idatagon}
      TINKOFF_SANDBOX_TOKEN: ${TINKOFF_SANDBOX_TOKEN:-}
      APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:-}
      SANDBOX_DEPOSIT: ${SANDBOX_DEPOSIT:-1000000}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal

  worker:
    build: .
    command: ["python", "-c", "import time\nwhile True: time.sleep(3600)"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://idatagon:idatagon@postgres:5432/idatagon}
      TINKOFF_SANDBOX_TOKEN: ${TINKOFF_SANDBOX_TOKEN:-}
      APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:-}
      SANDBOX_DEPOSIT: ${SANDBOX_DEPOSIT:-1000000}
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idatagon
      POSTGRES_PASSWORD: idatagon
      POSTGRES_DB: idatagon
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idatagon -d idatagon"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
