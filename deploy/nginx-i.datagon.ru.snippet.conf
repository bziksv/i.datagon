# Вставляется в vhost FastPanel вместо proxy на Apache :81.
# root — каталог web/; остальное уходит в uvicorn :8000.
# access log: combined, без заголовков. Токен кабинета не писать.
# FastPanel includes уже принимают if{} (редирект HTTP). TRACE и лишние методы — 405.

    access_log /var/www/i_datagon_ru_usr/data/logs/i.datagon.ru.access.log combined;

    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
        return 405;
    }

    root $root_path/web;
    index index.html;

    location = / {
        try_files /index.html @api;
    }

    location / {
        try_files $uri @api;
    }

    location @api {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
