# Вставляется в vhost FastPanel вместо proxy на Apache :81.
# root — каталог web/; остальное уходит в uvicorn :8000.

    root $root_path/web;
    index index.html;

    location = / {
        try_files /index.html @api;
    }

    location / {
        try_files $uri @api;
    }

    location @api {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
        include /etc/nginx/proxy_params;
    }
